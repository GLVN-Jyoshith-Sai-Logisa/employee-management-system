<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-page">
        <h1>Edit Employee</h1>
        <form method="POST" class="dark-form">
            <label>Name</label>
            <input type="text" name="name" value="{{ emp.name }}" required>

            <label>Department</label>
            <input type="text" name="department" value="{{ emp.department }}" required>

            <label>Position</label>
            <input type="text" name="position" value="{{ emp.position }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ emp.email }}">

            <label>Phone</label>
            <input type="text" name="phone" value="{{ emp.phone }}">

            <label>Salary</label>
            <input type="number" name="salary" value="{{ emp.salary }}">

            <button type="submit">Save Changes</button>
        </form>
        <a href="/employees" class="back-link">← Back to List</a>
    </div>
</body>
</html>
